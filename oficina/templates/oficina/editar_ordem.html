{% extends "oficina/base.html" %}

{% block content %}

<h2>Editar Ordem de Serviço</h2>

<form method="post">

{% csrf_token %}

<label>Cliente</label>
<select name="cliente" class="form-control">
{% for cliente in clientes %}
<option value="{{ cliente.id }}" {% if cliente.id == ordem.cliente.id %}selected{% endif %}>
{{ cliente.nome }}
</option>
{% endfor %}
</select>

<label>Equipamento</label>
<select name="equipamento" class="form-control">
{% for equipamento in equipamentos %}
<option value="{{ equipamento.id }}" {% if equipamento.id == ordem.equipamento.id %}selected{% endif %}>
{{ equipamento.marca }} {{ equipamento.modelo }}
</option>
{% endfor %}
</select>

<label>Problema</label>
<textarea name="problema" class="form-control">{{ ordem.problema }}</textarea>

<label>Diagnóstico</label>
<textarea name="diagnostico" class="form-control">{{ ordem.diagnostico }}</textarea>

<label>Valor (R$):</label>
<input type="text" name="valor" class="form-control" 
       value="{{ ordem.valor|floatformat:2 }}" 
       placeholder="0,00">

<label>Status:</label>
<select name="status" class="form-select"> <option value="recebido" {% if ordem.status == 'recebido' %}selected{% endif %}>Recebido</option>
    <option value="diagnostico" {% if ordem.status == 'diagnostico' %}selected{% endif %}>Em Diagnóstico</option>
    <option value="aprovacao" {% if ordem.status == 'aprovacao' %}selected{% endif %}>Aguardando Aprovação</option>
    <option value="reparo" {% if ordem.status == 'reparo' %}selected{% endif %}>Em Reparo</option>
    <option value="finalizado" {% if ordem.status == 'finalizado' %}selected{% endif %}>Finalizado</option>
    <option value="cancelado" {% if ordem.status == 'cancelado' %}selected{% endif %}>Cancelado</option>
</select>

<br>

<button type="submit" class="btn btn-success">
Salvar
</button>

<a href="/ordens/" class="btn btn-secondary">
Voltar
</a>

</form>

{% endblock %}
