<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema Assistência Técnica{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
    /* 1. Mensagens */
    .messages-container {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 10000;
        min-width: 320px;
        max-width: 400px;
    }

    /* 2. Select de Status (Ajustado para evitar erro de leitura) */
    .status-select-custom {
        appearance: none !important;
        -webkit-appearance: none !important;
        -moz-appearance: none !important;
        font-weight: bold !important;
        color: white !important;
        border-radius: 20px !important;
        text-align: center !important;
        cursor: pointer;
        border: none !important;
        padding: 5px 15px !important;
        height: 32px !important;
        line-height: 1 !important;
        font-size: 0.75rem !important;
        background-repeat: no-repeat !important;
        background-position: right 0.75rem center !important;
        background-size: 16px 12px !important;
    }

    /* SVG separado para não travar o validador do VS Code */
    .status-select-custom {
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='white' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e") !important;
    }

    /* 3. Cores de Fundo */
    .bg-recebido { background-color: #41eb1e !important; }
    .bg-diagnostico { background-color: #5bc0de !important; }
    .bg-aprovacao { background-color: #0275d8 !important; }
    .bg-reparo { background-color: #e9da0a !important; }
    .bg-finalizado { background-color: #2e9c1f !important; }
    .bg-cancelado { background-color: #e7120b !important; }

    /* 4. Bordas de Tabela */
    .tr-recebido { border-left: 6px solid #41eb1e !important; }
    .tr-diagnostico { border-left: 6px solid #5bc0de !important; }
    .tr-aprovacao { border-left: 6px solid #0275d8 !important; }
    .tr-reparo { border-left: 6px solid #e9da0a !important; }
    .tr-finalizado { border-left: 6px solid #2e9c1f !important; }
    .tr-cancelado { border-left: 6px solid #e7120b !important; }

    /* 5. Bordas do Dashboard */
    .border-dashboard-recebido { border-top: 6px solid #41eb1e !important; }
    .border-dashboard-diagnostico { border-top: 6px solid #5bc0de !important; }
    .border-dashboard-aprovacao { border-top: 6px solid #0275d8 !important; }
    .border-dashboard-reparo { border-top: 6px solid #e9da0a !important; }
    .border-dashboard-finalizado { border-top: 6px solid #2e9c1f !important; }
    .border-dashboard-cancelado { border-top: 6px solid #e7120b !important; }

    /* 6. Cores de Texto */
    .text-recebido { color: #41eb1e !important; }
    .text-diagnostico { color: #5bc0de !important; }
    .text-aprovacao { color: #0275d8 !important; }
    .text-reparo { color: #e9da0a !important; }
    .text-finalizado { color: #2e9c1f !important; }

    /* 7. Miscelânea */
    .status-select-custom option { color: #333 !important; background-color: white !important; }
    .table td, .table th { vertical-align: middle !important; padding: 12px 8px !important; }

    /* 8. Estilos para Alertas Customizados */
    .custom-alert {
        border: none !important;
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
    }
    
    .custom-alert-error {
        border-left: 5px solid #dc3545 !important;
        background-color: #f8d7da !important;
        color: #842029 !important;
    }
    
    .custom-alert-success {
        border-left: 5px solid #198754 !important;
        background-color: #d1e7dd !important;
        color: #0f5132 !important;
    }

</style>
    
</head>

<body class="bg-light">
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🛠 Assistência Técnica</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/clientes/">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/equipamentos/">Equipamentos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/ordens/">Ordens de Serviço</a></li>
                </ul>
                {% if request.user.is_authenticated %}
                <div class="d-flex align-items-center text-white">
                    <span class="me-3">Olá, <strong>{{ request.user.username }}</strong></span>
                    <form action="/logout/" method="post">
                        {% csrf_token %}
                        <button class="btn btn-outline-light btn-sm">Sair</button>
                    </form>
                </div>
                {% endif %}
            </div>
        </div>
    </nav>
    
    <div class="messages-container">
    {% if messages %}
        {% for message in messages %}
            <div class="alert custom-alert {% if message.tags == 'error' %}custom-alert-error{% else %}custom-alert-success{% endif %} alert-dismissible fade show mb-2" role="alert">
                <div class="d-flex align-items-center">
                    <i class="bi {% if message.tags == 'error' %}bi-exclamation-triangle-fill{% else %}bi-check-circle-fill{% endif %} me-2"></i>
                    <div>{{ message }}</div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}
</div>
    
    <div class="container mt-4 mb-5">
        <div class="card shadow-sm border-0">
            <div class="card-body">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auto-close alerts após 5 segundos
        setTimeout(function() {
            let alerts = document.querySelectorAll('.alert');
            alerts.forEach(function(alert) {
                let bsAlert = new bootstrap.Alert(alert);
                if (bsAlert) {
                    bsAlert.close();
                }
            });
        }, 5000);
    </script>
</body>
</html>
