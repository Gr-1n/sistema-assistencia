<!DOCTYPE html>
<html lang="pt-br">

<head>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Sistema Assistência Técnica{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="icon" href="data:,">

    <style>
        /* Estilo base do select */
        .status-select-custom {
            appearance: none !important;
            -webkit-appearance: none !important;
            -moz-appearance: none !important;
            font-weight: bold !important;
            color: white !important;
            border-radius: 20px !important;
            text-align: center !important;
            cursor: pointer;
            border: none !important;
            padding: 5px 15px !important;
            /* Seta branca */
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='white' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e") !important;
            background-repeat: no-repeat !important;
            background-position: right 0.75rem center !important;
            background-size: 16px 12px !important;
        }

        /* Cores dos Selects (BG) */
        .bg-recebido { background-color: #41eb1e !important; }
        .bg-diagnostico { background-color: #5bc0de !important; }
        .bg-aprovacao { background-color: #0275d8 !important; }
        .bg-reparo { background-color: #e9da0a !important; }
        .bg-finalizado { background-color: #2e9c1f !important; }
        .bg-cancelado { background-color: #e7120b !important; }

        /* Cores das Bordas das Linhas (TR) */
        .tr-recebido { border-left: 6px solid #41eb1e !important; }
        .tr-diagnostico { border-left: 6px solid #5bc0de !important; }
        .tr-aprovacao { border-left: 6px solid #0275d8 !important; }
        .tr-reparo { border-left: 6px solid #e9da0a !important; }
        .tr-finalizado { border-left: 6px solid #2e9c1f !important; }
        .tr-cancelado { border-left: 6px solid #e7120b !important; }

        /* Ajuste para as opções não sumirem no branco */
        .status-select-custom option { color: #333 !important; background-color: white !important; }

        /* Centraliza TODO o conteúdo das células da tabela verticalmente */
        .table td, .table th {
            vertical-align: middle !important;
            padding: 12px 8px !important; /* Aumenta um pouco o respiro interno */
        }

        /* Ajuste fino no select para ele não ser gigante */
        .status-select-custom {
            height: 32px !important; /* Define uma altura fixa padrão */
            line-height: 1 !important;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
            font-size: 0.75rem !important; /* Diminui levemente a fonte para caber melhor */
        }

        /* Cores das Bordas Superiores dos Cards do Dashboard */
        .border-dashboard-recebido { border-top: 6px solid #41eb1e !important; }
        .border-dashboard-diagnostico { border-top: 6px solid #5bc0de !important; }
        .border-dashboard-aprovacao { border-top: 6px solid #0275d8 !important; }
        .border-dashboard-reparo { border-top: 6px solid #e9da0a !important; }
        .border-dashboard-finalizado { border-top: 6px solid #2e9c1f !important; }
        .border-dashboard-cancelado { border-top: 6px solid #e7120b !important; }

        /* Cor do texto dos números no Dashboard para dar destaque */
        .text-recebido { color: #41eb1e !important; }
        .text-diagnostico { color: #5bc0de !important; }
        .text-aprovacao { color: #0275d8 !important; }
        .text-reparo { color: #e9da0a !important; }
        .text-finalizado { color: #2e9c1f !important; }

    </style>

</head>

</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">

<div class="container">

<a class="navbar-brand fw-bold" href="/">
🛠 Assistência Técnica
</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav me-auto">

<li class="nav-item">
<a class="nav-link" href="/clientes/">Clientes</a>
</li>

<li class="nav-item">
<a class="nav-link" href="/equipamentos/">Equipamentos</a>
</li>

<li class="nav-item">
<a class="nav-link" href="/ordens/">Ordens de Serviço</a>
</li>

</ul>

{% if request.user.is_authenticated %}

<div class="d-flex align-items-center text-white">

<span class="me-3">
Olá, <strong>{{ request.user.username }}</strong>
</span>

<form action="/logout/" method="post">
{% csrf_token %}
<button class="btn btn-outline-light btn-sm">
Sair
</button>
</form>

</div>

{% endif %}

</div>

</div>

</nav>

<div class="container mt-4">

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<div class="card shadow-sm border-0">

<div class="card-body">

{% block content %}

{% endblock %}

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
